name: Test Platform

on:
  workflow_call:
    inputs:
      target:
        description: Platform label used for artifacts and caches.
        required: true
        type: string
      runner:
        description: GitHub Actions runner label.
        required: true
        type: string
      os:
        description: Operating-system family (linux or darwin).
        required: true
        type: string
      agentd_target:
        description: Rust target for native Linux agentd tests.
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  test:
    name: Test (${{ inputs.target }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-bin: false
          cache-targets: true

      - name: Install build deps (Linux)
        if: inputs.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools libcap-ng-dev

      # Reuse the runtime already built by Check Platform. The SDK build script
      # discovers build/ in CI, so unit tests no longer repeat the release/LTO
      # msb, agentd, and libkrunfw build.
      - name: Download runtime artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: msb-${{ inputs.target }}
          path: build/

      - name: Test agentd (Linux)
        if: inputs.os == 'linux'
        run: |
          rustup target add --toolchain stable ${{ inputs.agentd_target }}
          cargo +stable test --manifest-path crates/agentd/Cargo.toml --target ${{ inputs.agentd_target }}

      - name: Set up mold (Linux host link)
        if: inputs.os == 'linux'
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # 2.41.0

      # macOS has no `/dev/shm`, so the cross-device file-mount staging tests would
      # skip there. A RAM disk gives them a real second filesystem whose device
      # differs from the sandbox directory the tests stage into (the checkout
      # filesystem), which is the comparison base #23 introduced.
      - name: Create a second filesystem for cross-device tests (macOS)
        if: inputs.os == 'darwin'
        run: |
          set -euo pipefail
          device="$(hdiutil attach -nomount ram://81920 | awk '{print $1}')"
          diskutil eraseVolume HFS+ microsandbox-cross-device "$device" >/dev/null
          echo "MSB_TEST_CROSS_DEVICE_DIR=/Volumes/microsandbox-cross-device" >> "$GITHUB_ENV"

      - name: Test workspace
        env:
          # Fail rather than skip when the second filesystem is missing: a silent
          # skip would leave the cross-device staging path untested. The second
          # filesystem must differ from the sandbox directory: Linux stages from
          # `/dev/shm`; the macOS step above supplies the RAM disk.
          MSB_TEST_REQUIRE_CROSS_DEVICE_TESTS: "1"
        run: cargo +stable test --workspace --exclude microsandbox-agentd

      - name: Detach the second filesystem (macOS)
        if: always() && inputs.os == 'darwin'
        run: hdiutil detach /Volumes/microsandbox-cross-device || true
